[project]
name = "coredriven"
version = "0.0.1"
description = "POS and Internet Cafe management"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "argon2-cffi>=25.1.0",
    "fastapi>=0.115.0",
    "jwt>=1.4.0",
    "passlib[bcrypt]>=1.7.4",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.0.0",
    "pyjwt>=2.13.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.32",
    "redis>=5.0.1",
    "uvicorn[standard]>=0.24.0",
    "websockets>=12.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.9.1",
    "pytest>=8.0.0",
    "ruff>=0.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
filterwarnings = [
    "ignore::SyntaxWarning",
]

[tool.ruff.lint]
# B008: Depends() in argument defaults is the idiomatic FastAPI pattern
# BLE001: broad except is used intentionally to normalize error handling
ignore = ["B008", "BLE001"]
